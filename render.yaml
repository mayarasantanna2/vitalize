services:
  - type: web
    name: vitalize
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready.php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        value: /etc/secrets/ca.pem
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "1"
      - key: UPLOADS_ENABLED
        value: "0"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PRIVACY_CONTACT
        sync: false
